scalar DateTime

enum NewsSource {
  HACKER_NEWS
  SPACEFLIGHT
  DEV_TO
}

type NewsItem {
  id: ID!
  source: NewsSource!
  title: String!
  url: String
  summary: String
  imageUrl: String
  publishedAt: DateTime!
  score: Int
  commentsCount: Int
  readTimeMinutes: Int
  tags: [String!]!
  author: Author
}

type Author {
  name: String!
  profileUrl: String
  karma: Int
}

type NewsEdge {
  cursor: String!
  node: NewsItem!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type NewsConnection {
  edges: [NewsEdge!]!
  pageInfo: PageInfo!
}

type SourceStatus {
  source: NewsSource!
  healthy: Boolean!
  latencyMs: Int
  lastError: String
  cachedAt: DateTime!
}

type User {
  id: ID!
  username: String!
  name: String
  email: String
  roles: [String!]!
}

input FeedFilter {
  sources: [NewsSource!]
  search: String
  tags: [String!]
}

type Query {
  feed(filter: FeedFilter, first: Int = 20, after: String): NewsConnection!
  item(id: ID!): NewsItem
  "Requires the admin role. Nullable, so an auth error does not wipe the rest of the response."
  sources: [SourceStatus!]
  "Requires a logged in user."
  me: User
}
