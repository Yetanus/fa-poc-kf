<header class="header">
  <div class="fa-container header__inner">
    <a routerLink="/" class="header__title">FA News Hub</a>

    <nav class="header__nav" aria-label="Główna nawigacja">
      <ul class="header__links">
        @for (link of links; track link.path) {
          <li>
            <a
              class="header__link"
              [routerLink]="link.path"
              routerLinkActive="header__link--active"
              ariaCurrentWhenActive="page"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <app-theme-toggle
      [dark]="themeService.theme() === 'dark'"
      (darkChange)="themeService.setTheme($event ? 'dark' : 'light')"
    />
  </div>
</header>
